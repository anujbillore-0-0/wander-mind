# Minimal SearXNG config for Wander Mind's research step.
# The secret comes from the SEARXNG_SECRET environment variable (see docker-compose.yml).
use_default_settings: true

general:
  instance_name: "wander-mind-search"

search:
  safe_search: 1
  formats:
    - html
    - json

server:
  secret_key: "overridden-by-SEARXNG_SECRET"
  limiter: false
  image_proxy: false
