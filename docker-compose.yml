name: wander-mind

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://wander:wander@db:5432/wandermind
  SEARXNG_URL: http://searxng:8080
  CORS_ORIGINS: http://localhost:3000

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: wander
      POSTGRES_PASSWORD: wander
      POSTGRES_DB: wandermind
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wander -d wandermind"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Self-hosted metasearch for blogs and forums - no search API key needed.
  searxng:
    image: searxng/searxng:latest
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-change-me-to-a-long-random-string}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    ports:
      - "8080:8080"
    restart: unless-stopped

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      searxng:
        condition: service_started
    ports:
      - "8000:8000"
    restart: unless-stopped

  # Keeps evidence fresh for SEED_DESTINATIONS and recently planned places.
  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    env_file:
      - path: .env
        required: false
    environment:
      <<: *backend-env
      RESEARCH_PARALLELISM: "1"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
